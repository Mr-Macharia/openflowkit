# Share-link Worker. Deploy from this folder: `npx wrangler deploy`. Ids and secrets are not kept here.
name = "openflowkit-share"
main = "index.ts"
compatibility_date = "2026-03-18"

routes = [{ pattern = "share.openflowkit.com", custom_domain = true }]

# The production app plus the `v2` branch preview on Cloudflare Pages, so sharing can be tried before a merge.
[vars]
ALLOWED_ORIGINS = "https://app.openflowkit.com,https://v2.openflowkit-app.pages.dev"

[[r2_buckets]]
binding = "SHARES"
bucket_name = "openflowkit-shares"

# Per-IP limit on POST /s: 10 uploads per 60 s, counted per Cloudflare location (soft, eventually consistent).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

# Secret, set with `npx wrangler secret put TURNSTILE_SECRET` (never written to this file).

# Free-tier guard: one global counter refuses uploads before R2 could bill (QUOTA_LIMITS in index.ts).
# SQLite-backed Durable Objects run on Workers Free.
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quota"]
